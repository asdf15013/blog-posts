server {
    listen 80;
    server_name yanqi-blog.vip www.yanqi-blog.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
    }

    location / {
        return 301 https://yanqi-blog.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yanqi-blog.vip www.yanqi-blog.vip;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/yanqi-blog.vip/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/yanqi-blog.vip/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 图片库导入上限 32MB + 余量
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
    }
}
